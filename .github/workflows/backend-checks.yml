name: Backend staging readiness
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dapr_test
          POSTGRES_PASSWORD: local-ci-fixture-only
          POSTGRES_DB: dapr_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dapr_test -d dapr_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:security
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://dapr-staging.invalid
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS50ZXN0JA
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_fixture
          VITE_CLERK_ACCOUNT_PORTAL_URL: https://fixture.accounts.dev
      - run: npm run test:database
        env:
          TEST_DATABASE_URL: postgres://dapr_test:local-ci-fixture-only@127.0.0.1:5432/dapr_test_ci
          TEST_DATABASE_ISOLATED: 'true'
      - name: Validate Linux image build (no push or deployment)
        run: >-
          docker build --build-arg VITE_API_BASE_URL=https://dapr-staging.invalid
          --build-arg VITE_CLERK_PUBLISHABLE_KEY=pk_test_Y2xlcmsuZXhhbXBsZS50ZXN0JA
          --build-arg VITE_STRIPE_PUBLISHABLE_KEY=pk_test_fixture
          --build-arg VITE_CLERK_ACCOUNT_PORTAL_URL=https://fixture.accounts.dev
          --tag dapr-staging-review:ci .
      - name: Create fresh database for container verification
        run: |
          node --input-type=module <<'JS'
          import { Client } from 'pg';
          const client = new Client({ connectionString: 'postgres://dapr_test:local-ci-fixture-only@127.0.0.1:5432/postgres' });
          await client.connect();
          await client.query('CREATE DATABASE dapr_test_container');
          await client.end();
          JS
      - name: Test Linux container startup and isolated database suites (no deployment)
        run: >-
          docker run --rm --network host
          -e TEST_DATABASE_ISOLATED=true
          -e TEST_DATABASE_URL=postgres://dapr_test:local-ci-fixture-only@127.0.0.1:5432/dapr_test_container
          dapr-staging-review:ci npm run test:database
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
      # Intentionally blocks readiness until inherited high/critical advisories are resolved.
      - run: npm audit --package-lock-only --omit=dev --audit-level=high
