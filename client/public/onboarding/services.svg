<?xml version="1.0" encoding="UTF-8"?>
<svg width="200px" height="160px" viewBox="0 0 200 160" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Choose Your Service</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Background Elements -->
        <circle cx="40" cy="40" r="15" fill="#ffffff" opacity="0.1"></circle>
        <circle cx="160" cy="30" r="10" fill="#ffffff" opacity="0.1"></circle>
        <circle cx="140" cy="130" r="20" fill="#ffffff" opacity="0.1"></circle>
        
        <!-- Service Tiers -->
        <g transform="translate(35, 30)">
            <!-- Basic Wash -->
            <rect x="0" y="0" width="40" height="70" rx="5" fill="#ffffff" opacity="0.6"></rect>
            <g transform="translate(10, 10)">
                <circle cx="10" cy="10" r="10" fill="#ffffff" opacity="0.9"></circle>
                <path d="M5,10 L8,13 L15,6" stroke="#8c52ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </g>
            <text x="20" y="45" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">BASIC</text>
            <text x="20" y="60" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">$30</text>
        </g>
        
        <g transform="translate(80, 20)">
            <!-- The OG -->
            <rect x="0" y="0" width="40" height="90" rx="5" fill="#ffffff" opacity="0.8"></rect>
            <g transform="translate(10, 10)">
                <circle cx="10" cy="10" r="10" fill="#ffffff" opacity="0.9"></circle>
                <path d="M5,10 L8,13 L15,6" stroke="#8c52ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M5,14 L15,14" stroke="#8c52ff" stroke-width="2" stroke-linecap="round"></path>
            </g>
            <text x="20" y="45" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">THE OG</text>
            <text x="20" y="60" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">$55</text>
            <text x="20" y="75" font-family="Arial" font-size="6" text-anchor="middle" fill="#ffffff">POPULAR</text>
        </g>
        
        <g transform="translate(125, 10)">
            <!-- Full Detail -->
            <rect x="0" y="0" width="40" height="110" rx="5" fill="#ffffff" opacity="0.9"></rect>
            <g transform="translate(10, 10)">
                <circle cx="10" cy="10" r="10" fill="#ffffff" opacity="0.9"></circle>
                <path d="M5,10 L8,13 L15,6" stroke="#8c52ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M5,14 L15,14" stroke="#8c52ff" stroke-width="2" stroke-linecap="round"></path>
                <path d="M5,18 L15,18" stroke="#8c52ff" stroke-width="2" stroke-linecap="round"></path>
            </g>
            <text x="20" y="45" font-family="Arial" font-size="7" text-anchor="middle" fill="#ffffff">FULL DETAIL</text>
            <text x="20" y="60" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">$175</text>
            <text x="20" y="75" font-family="Arial" font-size="6" text-anchor="middle" fill="#ffffff">PREMIUM</text>
        </g>
        
        <!-- Hand with Pointing Finger -->
        <g transform="translate(80, 130)">
            <path d="M15,0 C11.134,0 8,3.134 8,7 L8,15 L0,15 L0,30 L35,30 L35,15 L30,15 L30,8 C30,3.582 26.418,0 22,0 L15,0 Z" fill="#ffffff" opacity="0.8"></path>
            <path d="M15,0 L15,20 L8,20 L8,7 C8,3.134 11.134,0 15,0 Z" fill="#ffffff" opacity="0.6"></path>
            <path d="M22,0 L22,20 L15,20 L15,0 L22,0 Z" fill="#ffffff" opacity="0.7"></path>
            <path d="M30,8 L30,20 L22,20 L22,0 C26.418,0 30,3.582 30,8 Z" fill="#ffffff" opacity="0.6"></path>
        </g>
        
        <!-- Sparkles -->
        <g transform="translate(150, 70)" fill="#ffffff">
            <circle cx="0" cy="0" r="2"></circle>
            <path d="M0,-5 L0,5 M-5,0 L5,0" stroke="#ffffff" stroke-width="1"></path>
        </g>
        
        <g transform="translate(50, 110)" fill="#ffffff">
            <circle cx="0" cy="0" r="2"></circle>
            <path d="M0,-5 L0,5 M-5,0 L5,0" stroke="#ffffff" stroke-width="1"></path>
        </g>
        
        <!-- Pointer Indicator -->
        <path d="M100,120 L100,110 L105,115 L100,120 Z" fill="#ffffff" opacity="0.9"></path>
    </g>
</svg>