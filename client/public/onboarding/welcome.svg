<?xml version="1.0" encoding="UTF-8"?>
<svg width="200px" height="160px" viewBox="0 0 200 160" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Welcome to Dapper</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <g transform="translate(10, 15)">
            <!-- Car silhouette -->
            <path d="M160,80 C160,91.046 151.046,100 140,100 L40,100 C28.954,100 20,91.046 20,80 L20,60 L160,60 L160,80 Z" fill="#ffffff" opacity="0.9"></path>
            <path d="M155,60 L25,60 L35,40 C37.761,35 42.239,30 50,30 L130,30 C137.761,30 142.239,35 145,40 L155,60 Z" fill="#ffffff" opacity="0.9"></path>
            
            <!-- Windows -->
            <path d="M140,40 L130,40 L120,60 L150,60 L140,40 Z" fill="#e0f7fa" opacity="0.8"></path>
            <path d="M40,40 L50,40 L60,60 L30,60 L40,40 Z" fill="#e0f7fa" opacity="0.8"></path>
            
            <!-- Wheels -->
            <circle cx="50" cy="85" r="15" fill="#333333"></circle>
            <circle cx="50" cy="85" r="8" fill="#666666"></circle>
            <circle cx="130" cy="85" r="15" fill="#333333"></circle>
            <circle cx="130" cy="85" r="8" fill="#666666"></circle>
            
            <!-- Sparkles -->
            <g transform="translate(80, 20)" fill="#ffffff">
                <circle cx="0" cy="0" r="3"></circle>
                <path d="M0,-8 L0,8 M-8,0 L8,0" stroke="#ffffff" stroke-width="2"></path>
            </g>
            
            <g transform="translate(20, 40)" fill="#ffffff">
                <circle cx="0" cy="0" r="2"></circle>
                <path d="M0,-5 L0,5 M-5,0 L5,0" stroke="#ffffff" stroke-width="1"></path>
            </g>
            
            <g transform="translate(140, 35)" fill="#ffffff">
                <circle cx="0" cy="0" r="2"></circle>
                <path d="M0,-5 L0,5 M-5,0 L5,0" stroke="#ffffff" stroke-width="1"></path>
            </g>
            
            <!-- Light Beams -->
            <path d="M30,60 L10,80 L10,90 L30,65 Z" fill="#ffffff" opacity="0.3"></path>
            <path d="M150,60 L170,80 L170,90 L150,65 Z" fill="#ffffff" opacity="0.3"></path>
            
            <!-- Text -->
            <text x="90" y="120" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">DAPPER</text>
        </g>
        
        <!-- Water Droplets -->
        <g transform="translate(40, 10)" fill="#ffffff" opacity="0.8">
            <circle cx="0" cy="0" r="3"></circle>
            <path d="M0,0 Q-3,8 0,10 Q3,8 0,0 Z" fill="#ffffff"></path>
        </g>
        
        <g transform="translate(120, 8)" fill="#ffffff" opacity="0.8">
            <circle cx="0" cy="0" r="2"></circle>
            <path d="M0,0 Q-2,6 0,8 Q2,6 0,0 Z" fill="#ffffff"></path>
        </g>
        
        <g transform="translate(160, 15)" fill="#ffffff" opacity="0.8">
            <circle cx="0" cy="0" r="2.5"></circle>
            <path d="M0,0 Q-2.5,7 0,9 Q2.5,7 0,0 Z" fill="#ffffff"></path>
        </g>
    </g>
</svg>