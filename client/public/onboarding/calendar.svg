<?xml version="1.0" encoding="UTF-8"?>
<svg width="200px" height="160px" viewBox="0 0 200 160" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Book Your Appointment</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Calendar Background -->
        <rect x="40" y="30" width="120" height="100" rx="5" fill="#ffffff" opacity="0.9"></rect>
        
        <!-- Calendar Header -->
        <rect x="40" y="30" width="120" height="20" rx="5" fill="#8c52ff" opacity="0.8"></rect>
        <text x="100" y="45" font-family="Arial" font-size="12" text-anchor="middle" fill="#ffffff">APRIL 2025</text>
        
        <!-- Calendar Grid Lines -->
        <line x1="40" y1="70" x2="160" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.5"></line>
        <line x1="40" y1="90" x2="160" y2="90" stroke="#ffffff" stroke-width="1" opacity="0.5"></line>
        <line x1="40" y1="110" x2="160" y2="110" stroke="#ffffff" stroke-width="1" opacity="0.5"></line>
        
        <line x1="57" y1="50" x2="57" y2="130" stroke="#ffffff" stroke-width="1" opacity="0.5"></line>
        <line x1="74" y1="50" x2="74" y2="130" stroke="#ffffff" stroke-width="1" opacity="0.5"></line>
        <line x1="91" y1="50" x2="91" y2="130" stroke="#ffffff" stroke-width="1" opacity="0.5"></line>
        <line x1="108" y1="50" x2="108" y2="130" stroke="#ffffff" stroke-width="1" opacity="0.5"></line>
        <line x1="125" y1="50" x2="125" y2="130" stroke="#ffffff" stroke-width="1" opacity="0.5"></line>
        <line x1="142" y1="50" x2="142" y2="130" stroke="#ffffff" stroke-width="1" opacity="0.5"></line>
        
        <!-- Day Labels -->
        <text x="48" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">S</text>
        <text x="65" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">M</text>
        <text x="82" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">T</text>
        <text x="99" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">W</text>
        <text x="116" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">T</text>
        <text x="133" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">F</text>
        <text x="150" y="65" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">S</text>
        
        <!-- Dates -->
        <text x="48" y="83" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">30</text>
        <text x="65" y="83" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">31</text>
        <text x="82" y="83" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">1</text>
        <text x="99" y="83" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">2</text>
        <text x="116" y="83" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">3</text>
        <text x="133" y="83" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">4</text>
        <text x="150" y="83" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">5</text>
        
        <text x="48" y="103" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">6</text>
        <text x="65" y="103" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">7</text>
        <text x="82" y="103" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">8</text>
        <text x="99" y="103" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">9</text>
        <text x="116" y="103" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">10</text>
        <text x="133" y="103" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">11</text>
        <text x="150" y="103" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">12</text>
        
        <text x="48" y="123" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">13</text>
        <text x="65" y="123" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">14</text>
        <text x="82" y="123" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">15</text>
        
        <!-- Selected Date with Circle -->
        <circle cx="99" cy="123" r="12" fill="#8c52ff" opacity="0.9"></circle>
        <text x="99" y="123" font-family="Arial" font-size="10" text-anchor="middle" font-weight="bold" fill="#ffffff">16</text>
        
        <text x="116" y="123" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">17</text>
        <text x="133" y="123" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">18</text>
        <text x="150" y="123" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">19</text>
        
        <!-- Time Slot Elements -->
        <rect x="30" y="140" width="40" height="15" rx="3" fill="#8c52ff" opacity="0.7"></rect>
        <text x="50" y="151" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">9:00 AM</text>
        
        <rect x="80" y="140" width="40" height="15" rx="3" fill="#8c52ff" opacity="0.9"></rect>
        <text x="100" y="151" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">1:00 PM</text>
        
        <rect x="130" y="140" width="40" height="15" rx="3" fill="#8c52ff" opacity="0.7"></rect>
        <text x="150" y="151" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">4:30 PM</text>
        
        <!-- Decorative Elements -->
        <circle cx="30" cy="25" r="8" fill="#ffffff" opacity="0.2"></circle>
        <circle cx="170" cy="25" r="10" fill="#ffffff" opacity="0.2"></circle>
        <circle cx="30" cy="135" r="10" fill="#ffffff" opacity="0.2"></circle>
        <circle cx="170" cy="135" r="8" fill="#ffffff" opacity="0.2"></circle>
        
        <!-- Small Clock Icon -->
        <circle cx="25" cy="145" r="5" fill="#ffffff" opacity="0.8" stroke="#ffffff" stroke-width="1"></circle>
        <line x1="25" y1="145" x2="25" y2="142" stroke="#ffffff" stroke-width="1"></line>
        <line x1="25" y1="145" x2="27" y2="147" stroke="#ffffff" stroke-width="1"></line>
    </g>
</svg>