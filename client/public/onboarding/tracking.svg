<?xml version="1.0" encoding="UTF-8"?>
<svg width="200px" height="160px" viewBox="0 0 200 160" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Track Your Service</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Map Background -->
        <rect x="25" y="20" width="150" height="120" rx="5" fill="#ffffff" opacity="0.1"></rect>
        
        <!-- Map Roads -->
        <path d="M25,80 L175,80" stroke="#ffffff" stroke-width="4" opacity="0.5"></path>
        <path d="M100,20 L100,140" stroke="#ffffff" stroke-width="4" opacity="0.5"></path>
        <path d="M50,40 L150,120" stroke="#ffffff" stroke-width="3" opacity="0.3"></path>
        <path d="M50,120 L150,40" stroke="#ffffff" stroke-width="3" opacity="0.3"></path>
        
        <!-- Map Buildings and Features -->
        <rect x="40" y="40" width="20" height="20" rx="2" fill="#ffffff" opacity="0.3"></rect>
        <rect x="140" y="40" width="20" height="20" rx="2" fill="#ffffff" opacity="0.3"></rect>
        <rect x="40" y="100" width="20" height="20" rx="2" fill="#ffffff" opacity="0.3"></rect>
        <rect x="140" y="100" width="20" height="20" rx="2" fill="#ffffff" opacity="0.3"></rect>
        
        <!-- Your Location Marker -->
        <circle cx="70" cy="110" r="8" fill="#ffffff" opacity="0.9"></circle>
        <circle cx="70" cy="110" r="3" fill="#8c52ff"></circle>
        <text x="70" y="125" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">YOU</text>
        
        <!-- Provider Location Marker -->
        <circle cx="120" cy="65" r="8" fill="#8c52ff" opacity="0.9"></circle>
        <path d="M120,65 L120,60 M117,62 L123,62" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path>
        <text x="120" y="80" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">WASHER</text>
        
        <!-- Vehicle in Motion -->
        <g transform="translate(95, 65)">
            <!-- Car body -->
            <rect x="-10" y="-5" width="20" height="10" rx="2" fill="#ffffff"></rect>
            <!-- Wheels -->
            <circle cx="-7" cy="5" r="3" fill="#333333"></circle>
            <circle cx="7" cy="5" r="3" fill="#333333"></circle>
            <!-- Windows -->
            <rect x="-6" y="-4" width="12" height="4" rx="1" fill="#e0f7fa" opacity="0.6"></rect>
        </g>
        
        <!-- Status indicators -->
        <g transform="translate(100, 25)">
            <rect x="-40" y="0" width="80" height="15" rx="7.5" fill="#ffffff" opacity="0.8"></rect>
            <text x="0" y="11" font-family="Arial" font-size="10" text-anchor="middle" fill="#333333">ON THE WAY</text>
        </g>
        
        <!-- Progress Bar -->
        <rect x="50" y="140" width="100" height="10" rx="5" fill="#ffffff" opacity="0.3"></rect>
        <rect x="50" y="140" width="30" height="10" rx="5" fill="#8c52ff" opacity="0.9"></rect>
        <text x="100" y="148" font-family="Arial" font-size="6" text-anchor="middle" fill="#ffffff">30% COMPLETE</text>
        
        <!-- Path Line Between Points -->
        <path d="M70,110 C85,90 105,85 120,65" stroke="#8c52ff" stroke-width="2" stroke-dasharray="4" opacity="0.8"></path>
        
        <!-- ETA Display -->
        <g transform="translate(155, 130)">
            <rect x="-25" y="-15" width="50" height="20" rx="3" fill="#8c52ff" opacity="0.9"></rect>
            <text x="0" y="-3" font-family="Arial" font-size="8" text-anchor="middle" fill="#ffffff">ETA</text>
            <text x="0" y="7" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">10 MIN</text>
        </g>
        
        <!-- Compass Rose -->
        <g transform="translate(30, 30)">
            <circle cx="0" cy="0" r="8" fill="#ffffff" opacity="0.2"></circle>
            <text x="0" y="0" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="central" fill="#ffffff">N</text>
            <line x1="0" y1="-5" x2="0" y2="-10" stroke="#ffffff" stroke-width="1"></line>
        </g>
        
        <!-- Notification Indicator -->
        <g transform="translate(165, 40)">
            <circle cx="0" cy="0" r="10" fill="#8c52ff" opacity="0.8"></circle>
            <path d="M-4,-4 L4,4 M-4,4 L4,-4" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path>
        </g>
    </g>
</svg>