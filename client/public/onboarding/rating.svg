<?xml version="1.0" encoding="UTF-8"?>
<svg width="200px" height="160px" viewBox="0 0 200 160" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Rate Your Experience</title>
    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- Background Elements -->
        <circle cx="30" cy="30" r="10" fill="#ffffff" opacity="0.1"></circle>
        <circle cx="170" cy="30" r="15" fill="#ffffff" opacity="0.1"></circle>
        <circle cx="30" cy="130" r="15" fill="#ffffff" opacity="0.1"></circle>
        <circle cx="170" cy="130" r="10" fill="#ffffff" opacity="0.1"></circle>
        
        <!-- Rating Card -->
        <rect x="40" y="25" width="120" height="110" rx="10" fill="#ffffff" opacity="0.9"></rect>
        
        <!-- Car Image -->
        <g transform="translate(70, 40)">
            <!-- Car shape simplified -->
            <rect x="0" y="10" width="60" height="20" rx="5" fill="#333333"></rect>
            <rect x="10" y="0" width="40" height="15" rx="3" fill="#333333"></rect>
            <circle cx="15" cy="30" r="5" fill="#000000"></circle>
            <circle cx="45" cy="30" r="5" fill="#000000"></circle>
            <!-- Clean effect sparkles -->
            <circle cx="10" cy="5" r="2" fill="#ffffff"></circle>
            <circle cx="50" cy="5" r="2" fill="#ffffff"></circle>
            <circle cx="5" cy="20" r="1" fill="#ffffff"></circle>
            <circle cx="55" cy="20" r="1" fill="#ffffff"></circle>
        </g>
        
        <!-- Rating Stars -->
        <g transform="translate(50, 80)">
            <!-- Star 1 - Filled -->
            <path d="M10,0 L13,6 L20,7 L15,12 L16,19 L10,16 L4,19 L5,12 L0,7 L7,6 Z" fill="#8c52ff"></path>
            <!-- Star 2 - Filled -->
            <path d="M35,0 L38,6 L45,7 L40,12 L41,19 L35,16 L29,19 L30,12 L25,7 L32,6 Z" fill="#8c52ff"></path>
            <!-- Star 3 - Filled -->
            <path d="M60,0 L63,6 L70,7 L65,12 L66,19 L60,16 L54,19 L55,12 L50,7 L57,6 Z" fill="#8c52ff"></path>
            <!-- Star 4 - Filled -->
            <path d="M85,0 L88,6 L95,7 L90,12 L91,19 L85,16 L79,19 L80,12 L75,7 L82,6 Z" fill="#8c52ff"></path>
            <!-- Star 5 - Outline -->
            <path d="M110,0 L113,6 L120,7 L115,12 L116,19 L110,16 L104,19 L105,12 L100,7 L107,6 Z" fill="none" stroke="#8c52ff" stroke-width="1"></path>
        </g>
        
        <!-- Rating Text -->
        <text x="100" y="115" font-family="Arial" font-size="8" text-anchor="middle" fill="#333333">How was your Dapper experience?</text>
        
        <!-- Comment Box -->
        <rect x="50" y="120" width="100" height="5" rx="2" fill="#e0e0e0"></rect>
        
        <!-- Submit Button -->
        <g transform="translate(100, 135)">
            <rect x="-25" y="-10" width="50" height="20" rx="10" fill="#8c52ff"></rect>
            <text x="0" y="4" font-family="Arial" font-size="10" text-anchor="middle" fill="#ffffff">SUBMIT</text>
        </g>
        
        <!-- Feedback Title -->
        <text x="100" y="40" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#333333">YOUR FEEDBACK</text>
        
        <!-- Happy Face -->
        <g transform="translate(170, 80)">
            <circle cx="0" cy="0" r="15" fill="#8c52ff" opacity="0.2"></circle>
            <circle cx="-5" cy="-5" r="2" fill="#8c52ff"></circle>
            <circle cx="5" cy="-5" r="2" fill="#8c52ff"></circle>
            <path d="M-7,5 C-5,9 5,9 7,5" stroke="#8c52ff" stroke-width="2" stroke-linecap="round" fill="none"></path>
        </g>
        
        <!-- Thank You Message Effect -->
        <g transform="translate(30, 70)">
            <text x="0" y="0" font-family="Arial" font-size="10" font-weight="bold" fill="#8c52ff" opacity="0.5">THANK</text>
            <text x="0" y="12" font-family="Arial" font-size="10" font-weight="bold" fill="#8c52ff" opacity="0.5">YOU!</text>
        </g>
    </g>
</svg>